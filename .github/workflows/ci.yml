name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Check supply-chain policy
        run: bun run security:check
      - name: Audit dependencies
        run: bun run security:audit
      - name: Check with Biome
        run: bun run check

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: bun run build

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test
        run: bun run test:ci

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps
      - name: Run E2E tests
        run: bun run e2e

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Type check
        run: bun run typecheck
